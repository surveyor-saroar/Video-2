<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Study Hack - Reels Animation (9:16)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Inter:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Hind Siliguri', 'Inter', sans-serif;
      background-color: #f6f8fc;
      background-image:
        radial-gradient(circle at 20% 18%, rgba(37, 99, 235, 0.14), transparent 46%),
        radial-gradient(circle at 80% 82%, rgba(245, 158, 11, 0.14), transparent 48%);
    }

    /* Fixed 405x720 base canvas auto-scaled cleanly to fit any screen */
    #reelCanvas {
      position: relative;
      z-index: 1;
      width: 405px;
      height: 720px;
      flex-shrink: 0;
      background: transparent;
      overflow: hidden;
      cursor: pointer;
      transform-origin: center center;
    }

    .scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 46px 26px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      z-index: 2;
    }

    .scene.active {
      display: flex;
    }

    .blue { color: #2563eb; }
    .muted { color: #94a3b8; }

    .h1-main {
      font-size: 31px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.25;
    }

    .h2-sub {
      font-size: 25px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.28;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-family: 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    /* Scene 1 */
    .cards-flow {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 90%;
      margin: 10px 0;
    }

    .white-card {
      width: 100%;
      background: #ffffff;
      border-radius: 18px;
      padding: 15px 16px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.07);
      border: 1.5px solid #e2e8f0;
      position: relative;
      text-align: left;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .skel {
      height: 10px;
      border-radius: 99px;
      background: #e2e8f0;
      margin-bottom: 8px;
      transition: background 0.16s ease;
    }

    .ring-pulse {
      position: absolute;
      right: 14px;
      bottom: 10px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 3px solid #2563eb;
      background: rgba(37, 99, 235, 0.08);
    }

    .yellow-tag {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      font-weight: 700;
      font-size: 13px;
      padding: 3px 11px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    /* Scene 2 */
    .pencil-anim {
      font-size: 46px;
      margin-bottom: 14px;
    }

    /* Scene 3 */
    .phone-body {
      width: 74%;
      background: #0f172a;
      border-radius: 30px;
      padding: 10px;
      box-shadow: 0 22px 45px rgba(15, 23, 42, 0.2);
      margin: 12px 0;
    }

    .phone-display {
      background: #ffffff;
      border-radius: 20px;
      padding: 13px 12px;
      position: relative;
      overflow: hidden;
    }

    .scan-box {
      border: 2px solid #93c5fd;
      border-radius: 14px;
      padding: 12px 10px;
      position: relative;
      margin-bottom: 11px;
    }

    .laser-line {
      position: absolute;
      left: 6px;
      right: 6px;
      top: 10%;
      height: 3px;
      background: #2563eb;
      box-shadow: 0 0 12px #2563eb;
    }

    .copy-action {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 14px;
      background: #2563eb;
      color: #ffffff;
      transition: background 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .copy-action.copied {
      background: #facc15;
      color: #0f172a;
      transform: scale(1.03);
    }

    .kbd-box {
      position: relative;
      display: inline-grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      background: #e2e8f0;
      padding: 8px;
      border-radius: 10px;
      margin-top: 8px;
    }

    .kbd-box span {
      width: 16px;
      height: 10px;
      background: #ffffff;
      border-radius: 3px;
    }

    .kbd-box::after {
      content: "";
      position: absolute;
      left: -6px;
      right: -6px;
      top: 50%;
      height: 3px;
      background: #f59e0b;
      transform: rotate(-14deg);
    }

    /* Scene 4 */
    .chat-box {
      width: 100%;
      background: #ffffff;
      border-radius: 22px;
      padding: 14px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 330px;
      justify-content: space-between;
      margin: 12px 0;
    }

    .bubble-pasted {
      align-self: flex-end;
      background: #2563eb;
      color: #ffffff;
      padding: 9px 13px;
      border-radius: 14px 14px 4px 14px;
      font-size: 13px;
      font-weight: 600;
      text-align: left;
      width: 78%;
    }

    .bubble-prompt {
      align-self: flex-end;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #0f172a;
      padding: 9px 13px;
      border-radius: 14px 14px 4px 14px;
      font-size: 13px;
      font-weight: 600;
      text-align: left;
      max-width: 88%;
    }

    .input-bar {
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 99px;
      padding: 7px 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #0f172a;
      min-height: 38px;
    }

    .send-icon {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #2563eb;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }

    .time-chip {
      background: #fef08a;
      color: #854d0e;
      font-weight: 700;
      font-size: 14px;
      padding: 6px 16px;
      border-radius: 99px;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    /* Scene 5 */
    .gamma-box {
      width: 94%;
      background: #ffffff;
      border-radius: 22px;
      padding: 18px 14px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
      margin: 12px 0;
    }

    .dashed-area {
      border: 2px dashed #93c5fd;
      background: #eff6ff;
      border-radius: 14px;
      padding: 13px;
      margin-bottom: 14px;
      text-align: left;
    }

    .slides-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .card-blue {
      background: #2563eb;
      border-radius: 12px;
      padding: 12px;
      height: 104px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-light {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px;
      height: 104px;
    }

    /* Scene 6 */
    .teacher-box {
      background: #ffffff;
      border-radius: 22px;
      padding: 26px 20px;
      box-shadow: 0 18px 45px rgba(37, 99, 235, 0.12);
      border: 1px solid #e2e8f0;
      width: 92%;
    }

    .hl-yellow {
      background: linear-gradient(transparent 55%, #fde68a 55%);
      padding: 0 5px;
    }

    /* Scene 7 & 8 */
    .comment-bar {
      width: 95%;
      background: #ffffff;
      border-radius: 99px;
      padding: 9px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.09);
      border: 1px solid #e2e8f0;
    }

    .tools-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 92%;
      margin: 12px 0;
    }

    .tool-row {
      background: #ffffff;
      border-radius: 16px;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.06);
      border: 1px solid #e2e8f0;
      text-align: left;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .prog-track {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: rgba(15, 23, 42, 0.08);
      z-index: 10;
    }

    .prog-fill {
      height: 100%;
      width: 0%;
      background: #2563eb;
    }
  </style>
</head>
<body onclick="enableSound()">

  <div id="reelCanvas">

    <section class="scene active" id="sc1">
      <h1 class="h1-main" id="sc1Title">প্রশ্নের ছবি তুললেই<br>পুরো <span class="blue">নোট রেডি।</span></h1>
