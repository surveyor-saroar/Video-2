<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Study Hack - Reels Animation (9:16)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Inter:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090d16;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Hind Siliguri', 'Inter', sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* 9:16 Reels Viewport Container */
    .reel-wrapper {
      position: relative;
      height: 88vh;
      max-height: 920px;
      aspect-ratio: 9 / 16;
      background: #f6f8fc;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.7);
    }

    /* Ambient Soft Blobs */
    .blob-blue {
      position: absolute;
      top: -10%;
      left: -15%;
      width: 65%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.18) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .blob-amber {
      position: absolute;
      bottom: -10%;
      right: -15%;
      width: 65%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.16) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .scene {
      position: absolute;
      inset: 0;
      padding: 11% 7%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      z-index: 1;
      animation: fadeScene 0.35s ease;
    }

    .scene.active {
      display: flex;
    }

    @keyframes fadeScene {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .blue { color: #2563eb; }
    .muted { color: #94a3b8; }

    .hero-title {
      font-size: clamp(24px, 4.4vh, 44px);
      font-weight: 700;
      color: #0f172a;
      line-height: 1.25;
    }

    .sub-title {
      font-size: clamp(20px, 3.6vh, 36px);
      font-weight: 700;
      color: #0f172a;
      line-height: 1.3;
    }

    .brand-header {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Inter', sans-serif;
      font-size: clamp(16px, 2.6vh, 26px);
      font-weight: 800;
      color: #0f172a;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 14px;
    }

    /* Scene 1 */
    .flow-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 88%;
    }

    .doc-card {
      width: 100%;
      background: #ffffff;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 14px 35px rgba(15, 23, 42, 0.08);
      border: 1.5px solid #e2e8f0;
      position: relative;
      text-align: left;
    }

    .skeleton-line {
      height: 10px;
      border-radius: 99px;
      background: #e2e8f0;
      margin-bottom: 9px;
      transition: background 0.2s ease;
    }

    .scan-ring {
      position: absolute;
      right: 14px;
      bottom: 12px;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 3px solid #2563eb;
      background: rgba(37, 99, 235, 0.08);
      animation: pulseRing 1.3s infinite ease-in-out;
    }

    @keyframes pulseRing {
      0%, 100% { transform: scale(0.92); }
      50% { transform: scale(1.08); }
    }

    .note-pill {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      font-weight: 700;
      font-size: 14px;
      padding: 3px 12px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    /* Scene 2 */
    .pencil-badge {
      font-size: 42px;
      margin-bottom: 10px;
      animation: floatPencil 1s infinite alternate ease-in-out;
    }

    @keyframes floatPencil {
      from { transform: translateY(0) rotate(-8deg); }
      to { transform: translateY(-10px) rotate(6deg); }
    }

    /* Scene 3 */
    .phone-frame {
      width: 74%;
      background: #0f172a;
      border-radius: 34px;
      padding: 12px;
      box-shadow: 0 24px 50px rgba(15, 23, 42, 0.22);
    }

    .phone-screen {
      background: #ffffff;
      border-radius: 24px;
      padding: 16px 14px;
      position: relative;
      overflow: hidden;
    }

    .scan-box {
      border: 2px solid #93c5fd;
      border-radius: 16px;
      padding: 14px 12px;
      position: relative;
      margin-bottom: 14px;
    }

    .scan-line {
      position: absolute;
      left: 8px;
      right: 8px;
      top: 10%;
      height: 3px;
      background: #2563eb;
      box-shadow: 0 0 12px #2563eb;
    }

    .lens-btn {
      width: 100%;
      padding: 11px;
      border-radius: 14px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 15px;
      background: #2563eb;
      color: #ffffff;
      transition: all 0.25s ease;
    }

    .lens-btn.copied {
      background: #facc15;
      color: #0f172a;
      transform: scale(1.03);
    }

    .keyboard-strike {
      position: relative;
      display: inline-grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      background: #e2e8f0;
      padding: 9px;
      border-radius: 12px;
      margin-top: 8px;
    }

    .keyboard-strike span {
      width: 18px;
      height: 11px;
      background: #ffffff;
      border-radius: 3px;
    }

    .keyboard-strike::after {
      content: "";
      position: absolute;
      left: -6px;
      right: -6px;
      top: 50%;
      height: 3px;
      background: #f59e0b;
      transform: rotate(-14deg);
    }

    /* Scene 4 */
    .chat-window {
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.09);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 55%;
      justify-content: space-between;
    }

    .bubble-blue {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
      padding: 10px 14px;
      border-radius: 16px 16px 4px 16px;
      font-size: 14px;
      font-weight: 600;
      text-align: left;
      width: 78%;
    }

    .bubble-user {
      align-self: flex-end;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #0f172a;
      padding: 10px 14px;
      border-radius: 16px 16px 4px 16
