<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gamma AI & Touch Network</title>
  <link rel="stylesheet" href="style.css?v=10" />
</head>
<body>
  <main class="main-stage">
    <section class="gamma-ai-box">
      <h1 class="gamma-title">গামা এআই</h1>
      <p class="gamma-desc">
        স্মার্ট টাচ নেটওয়ার্ক ও ব্যাকগ্রাউন্ড অ্যানিমেশন সিস্টেম
      </p>
    </section>

    <section class="hand-network-box">
      <span class="pulse-aura" aria-hidden="true"></span>
      <img
        id="touchHandImg"
        class="touch-network-img"
        src="touchnetwork.png"
        alt="Touch Network Hand"
      />
    </section>

    <div class="status-bottom-box" id="statusBox">
      অ্যানিমেশন ও ব্যাকগ্রাউন্ড সং চলছে...
    </div>
  </main>

  <audio id="letmegoaudio" src="letmegoaudio.mp3" preload="auto"></audio>
  <script src="script.js?v=10"></script>
</body>
</html>
