    .scene {

      text-align: center; z-index: 2;

    .scene.active { display: flex; }

    #strokeTransition {

    .skel { height: 9px; border-radius: 99px; background: #e2e8f0; margin-bottom: 7px; }
    .ring-pulse {

    .pencil-anim { font-size: 46px; margin-bottom: 10px; }

    .phone-body {

    .phone-display { background: #ffffff; border-radius: 20px; padding: 11px; position: relative; overflow: hidden; }
    .scan-box { border: 2px solid #93c5fd; border-radius: 14px; padding: 10px; position: relative; margin-bottom: 9px; }
