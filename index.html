<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gamma AI & Touch Network Auto Animation</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background-color: #090d16;
      color: #f8fafc;
      font-family: "Segoe UI", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .main-stage {
      width: 100%;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .gamma-ai-box {
      width: fit-content;
      max-width: min(92vw, 440px);
      margin: 0 auto;
      padding: 10px 16px;
      border-radius: 13px;
      background-color: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(125, 211, 252, 0.38);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.48);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 5px;
      will-change: transform, box-shadow;
    }

    .gamma-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.25;
      letter-spacing: 0.2px;
      color: #ffd400;
    }

    .gamma-desc {
      margin: 0;
      font-size: 13px;
      line-height: 1.4;
      letter-spacing: 0.1px;
      word-spacing: normal;
      color: #e2e8f0;
    }

    .hand-network-box {
      width: fit-content;
      max-width: min(90vw, 340px);
      margin: 0 auto;
      padding: 14px 18px;
      border-radius: 14px;
      background-color: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      will-change: box-shadow;
    }

    .pulse-aura {
      position: absolute;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 2.5px solid #ffd400;
      pointer-events: none;
      z-index: 3;
      will-change: transform, opacity;
    }

    .touch-network-img {
      display: block;
      max-width: 240px;
      max-height: 140px;
      width: auto;
      height: auto;
      object-fit: contain;
      position: relative;
      z-index: 2;
      will-change: transform;
    }

    .touch-network-fallback {
      width: 200px;
      height: 120px;
      display: none;
      position: relative;
      z-index: 2;
      will-change: transform;
    }

    .status-bottom-box {
      width: fit-content;
      max-width: min(92vw, 400px);
      margin: 0 auto;
      padding: 7px 14px;
      border-radius: 10px;
      background-color: #162033;
      border: 1px solid #2b3b55;
      color: #f1f5f9;
      font-size: 12.5px;
      line-height: 1.35;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="main-stage">
    <section class="gamma-ai-box">
      <h1 class="gamma-title">গামা এআই</h1>
      <p class="gamma-desc">
        স্মার্ট টাচ নেটওয়ার্ক ও ব্যাকগ্রাউন্ড অ্যানিমেশন সিস্টেম
      </p>
    </section>

    <section class="hand-network-box">
      <span class="pulse-aura" aria-hidden="true"></span>

      <img
        id="touchHandImg"
        class="touch-network-img"
        src="touchnetwork"
        alt="Touch Network Hand"
      />

      <svg
        id="touchHandFallback"
        class="touch-network-fallback"
        viewBox="0 0 220 120"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <circle cx="112" cy="30" r="12" fill="none" stroke="#ffd400" stroke-width="2" />
        <circle cx="112" cy="30" r="4" fill="#ffd400" />
        <path
          d="M107 70 L107 40 C107 36 113 36 113 40 L113 68 L113 46 C113 42 119 42 119 46 L119 70 L119 52 C119 48 125 48 125 52 L125 78 C125 92 117 104 106 110 L86 110 C79 98 76 84 76 70 L90 58 C93 55 97 59 94 63 L102 71 Z"
          fill="rgba(30, 41, 59, 0.85)"
          stroke="#7dd3fc"
          stroke-width="2.2"
          stroke-linejoin="round"
        />
      </svg>
    </section>

    <div class="status-bottom-box" id="statusBox">
      অ্যানিমেশন ও ব্যাকগ্রাউন্ড সং চালু হচ্ছে...
    </div>
  </main>

  <audio id="letmegoaudio" preload="auto"></audio>

  <script>
    (function () {
      function startSystem() {
        var gammaBox = document.querySelector(".gamma-ai-box");
        var handBox = document.querySelector(".hand-network-box");
        var touchHandImg = document.getElementById("touchHandImg");
        var touchHandFallback = document.getElementById("touchHandFallback");
        var pulseAura = document.querySelector(".pulse-aura");
        var statusBox = document.getElementById("statusBox");
        var letmegoaudio = document.getElementById("letmegoaudio");

        // ১৫০ সেকেন্ডের ক্লিপের শুরু থেকে প্রয়োজনমতো সময় (যেমন ৩০ সেকেন্ড = 30000 ms)
        var neededDurationMs = 30000;
        var maxAudioSeconds = 150;
        var audioTimer = null;
        var audioStarted = false;

        // ১. touchnetwork ইমেজ লোড করা
        var imgList = [
          "touchnetwork",
          "touchnetwork.png",
          "touchnetwork.jpg",
          "touchnetwork.jpeg",
          "touchnetwork.webp"
        ];
        var imgIdx = 0;

        if (touchHandImg) {
          touchHandImg.src = imgList[0];
          touchHandImg.onerror = function () {
            imgIdx += 1;
            if (imgIdx < imgList.length) {
              touchHandImg.src = imgList[imgIdx];
            } else {
              touchHandImg.style.display = "none";
              if (touchHandFallback) {
                touchHandFallback.style.display = "block";
              }
            }
          };
        }

        // ২. letmegoaudio অডিও লোড করা
        var audioList = [
          "letmegoaudio",
          "letmegoaudio.mp3",
          "letmegoaudio.wav",
          "letmegoaudio.ogg",
          "letmegoaudio.m4a"
        ];
        var audioIdx = 0;

        if (letmegoaudio) {
          letmegoaudio.src = audioList[0];
          letmegoaudio.onerror = function () {
            audioIdx += 1;
            if (audioIdx < audioList.length) {
              letmegoaudio.src = audioList[audioIdx];
            }
          };

          letmegoaudio.ontimeupdate = function () {
            if (letmegoaudio.currentTime >= maxAudioSeconds) {
              letmegoaudio.pause();
              letmegoaudio.currentTime = 0;
            }
          };
        }

        // ৩. অ্যানিমেশন শুরু হওয়ার সাথে সাথে ব্যাকগ্রাউন্ড সং চালু করার ফাংশন
        function triggerBackgroundSong() {
          if (!letmegoaudio) return;

          try {
            // অ্যানিমেশনের ছোট সাউন্ড স্পষ্ট রাখতে ব্যাকগ্রাউন্ড সং কম ভলিউমে (১২%)
            letmegoaudio.volume = 0.12;
            if (!audioStarted) {
              letmegoaudio.currentTime = 0;
            }

            var playLimit = Math.min(neededDurationMs, maxAudioSeconds * 1000);
            var playPromise = letmegoaudio.play();

            if (playPromise && typeof playPromise.then === "function") {
              playPromise.then(function () {
                audioStarted = true;
                if (statusBox) {
                  statusBox.textContent = "অ্যানিমেশন ও ব্যাকগ্রাউন্ড সং চলছে";
                }
              }).catch(function () {
                if (statusBox) {
                  statusBox.textContent = "অ্যানিমেশন চলছে • সং শুনতে স্ক্রিনে টাচ করুন";
                }
              });
            } else {
              audioStarted = true;
              if (statusBox) {
                statusBox.textContent = "অ্যানিমেশন ও ব্যাকগ্রাউন্ড সং চলছে";
              }
            }

            if (audioTimer) {
              clearTimeout(audioTimer);
            }

            audioTimer = setTimeout(function () {
              letmegoaudio.pause();
              letmegoaudio.currentTime = 0;
              audioStarted = false;
              if (statusBox) {
                statusBox.textContent = "অ্যানিমেশন চলছে";
              }
            }, playLimit);
          } catch (err) {
            if (statusBox) {
              statusBox.textContent = "অ্যানিমেশন চলছে";
            }
          }
        }

        // ৪. সরাসরি ভিজ্যুয়াল অ্যানিমেশন লুপ
        var startTime = null;

        function runAnimation(timestamp) {
          if (!startTime) startTime = timestamp;
          var t = (timestamp - startTime) / 1000;

          var moveY = Math.sin(t * 3.4) * 9;
          var tilt = Math.sin(t * 2.4) * 3.5;
          var scaleHand = 1 + Math.sin(t * 3.4) * 0.05;

          var handTransform =
            "translate3d(0px, " +
            moveY.toFixed(2) +
            "px, 0px) rotate(" +
            tilt.toFixed(2) +
            "deg) scale(" +
            scaleHand.toFixed(3) +
            ")";

          if (touchHandImg && touchHandImg.style.display !== "none") {
            touchHandImg.style.transform = handTransform;
          }
          if (touchHandFallback && touchHandFallback.style.display !== "none") {
            touchHandFallback.style.transform = handTransform;
          }

          if (pulseAura) {
            var p = (t * 0.85) % 1;
            var ringScale = 0.5 + p * 2.2;
            var ringOpacity = (1 - p) * 0.9;
            pulseAura.style.transform = "scale(" + ringScale.toFixed(2) + ")";
            pulseAura.style.opacity = ringOpacity.toFixed(2);
          }

          if (gammaBox) {
            var gScale = 1 + Math.sin(t * 2.5) * 0.016;
            gammaBox.style.transform = "scale(" + gScale.toFixed(4) + ")";
            gammaBox.style.boxShadow = "0 0 20px rgba(255, 212, 0, 0.22)";
          }

          if (handBox) {
            var glow = 0.25 + (Math.sin(t * 3.0) + 1) * 0.25;
            handBox.style.boxShadow = "0 0 22px rgba(56, 189, 248, " + glow.toFixed(2) + ")";
          }

          requestAnimationFrame(runAnimation);
        }

        // অ্যানিমেশন শুরু + সাথে সাথে ব্যাকগ্রাউন্ড সং চালুর চেষ্টা
        requestAnimationFrame(runAnimation);
        triggerBackgroundSong();

        // ব্রাউজার অটোপ্লে আটকালে প্রথম ক্লিক/টাচেই কোনো বাটন ছাড়া সং চালু হবে
        document.addEventListener("pointerdown", function onceTouch() {
          if (!audioStarted) {
            triggerBackgroundSong();
          }
          document.removeEventListener("pointerdown", onceTouch);
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", startSystem);
      } else {
        startSystem();
      }
    })();
  </script>
</body>
</html>
