<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Study Hack - 9:16 Reels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Inter:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Full Screen Background */
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Hind Siliguri', 'Inter', sans-serif;
      background:
        radial-gradient(circle at 20% 20%, rgba(37, 99, 235, 0.22), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.16), transparent 45%),
        #090d16;
    }

    /* 9:16 Reels Canvas Only */
    .reel-canvas {
      position: relative;
      height: 94vh;
      max-height: 960px;
      aspect-ratio: 9 / 16;
      background: #f6f8fc;
      border-radius: 30px;
      overflow: hidden;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.75);
      cursor: pointer;
    }

    .blob-blue {
      position: absolute;
      top: -12%;
      left: -16%;
      width: 66%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .blob-amber {
      position: absolute;
      bottom: -12%;
      right: -16%;
      width: 66%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.16) 0%, transparent 70%);
      pointer-events: none;
    }

    .scene {
      position: absolute;
      inset: 0;
      padding: 11% 7%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      z-index: 2;
      animation: sceneIn 0.35s ease;
    }

    .scene.active {
      display: flex;
    }

    @keyframes sceneIn {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .blue { color: #2563eb; }
    .muted { color: #94a3b8; }

    .hero-title {
      font-size: clamp(26px, 4.4vh, 45px);
      font-weight: 700;
      color: #0f172a;
      line-height: 1.24;
    }

    .sub-title {
      font-size: clamp(21px, 3.6vh, 37px);
      font-weight: 700;
      color: #0f172a;
      line-height: 1.28;
    }

    .brand-row {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Inter', sans-serif;
      font-size: clamp(18px, 2.8vh, 28px);
      font-weight: 800;
      color: #0f172a;
    }

    .brand-badge {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: #2563eb;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 14px;
    }

    /* Scene 1 */
    .flow-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 86%;
    }

    .card {
