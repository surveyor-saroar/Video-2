<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Study Hack - 9:16 Reels Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Inter:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Hind Siliguri', 'Inter', sans-serif;
      background-color: #f6f8fc;
      background-image:
        radial-gradient(circle at 22% 18%, rgba(37, 99, 235, 0.14), transparent 46%),
        radial-gradient(circle at 78% 82%, rgba(245, 158, 11, 0.14), transparent 48%);
    }

    /* 9:16 Reels Frame in Center */
    #reelCanvas {
      position: relative;
      z-index: 1;
      width: 405px;
      height: 720px;
      flex-shrink: 0;
      background: transparent;
      overflow: hidden;
      cursor: pointer;
      transform-origin: center center;
    }

    .scene {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      padding: 28px 24px 72px;
      gap: 10px;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 2;
    }

    .scene.active {
      display: flex;
    }

    .blue { color: #2563eb; }
    .muted { color: #94a3b8; }

    .h1-main {
      font-size: 31px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.24;
    }

    .h2-sub {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.26;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-family: 'Inter', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .cards-flow {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 90%;
      margin: 4px 0;
    }

    .white-card {
      width: 100%;
      background: #ffffff;
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.07);
      border: 1.5px solid #e2e8f0;
      position: relative;
      text-align: left;
    }

    .skel {
      height: 10px;
      border-radius: 99px;
      background: #e2e8f0;
      margin-bottom: 8px;
    }

    .ring-pulse {
      position: absolute;
      right: 14px;
      bottom: 10px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 3px solid #2563eb;
      background: rgba(37, 99, 235, 0.08);
    }

    .yellow-tag {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      font-weight: 700;
      font-size: 13px;
      padding: 3px 11px;
      border-radius: 8px;
      margin-bottom: 8px;
    }

    .pencil-anim {
      font-size: 46px;
      margin-bottom: 10px;
    }

    .phone-body {
      width: 72%;
      background: #0f172a;
      border-radius: 30px;
      padding: 10px;
      box-shadow: 0 22px 45px rgba(15, 23, 42, 0.2);
      margin: 4px 0;
    }

    .phone-display {
      background: #ffffff;
      border-radius: 20px;
      padding: 12px;
      position: relative;
      overflow: hidden;
    }

    .scan-box {
      border: 2px solid #93c5fd;
      border-radius: 14px;
      padding: 11px 10px;
      position: relative;
      margin-bottom: 10px;
    }

    .laser-line {
      position: absolute;
      left: 6px;
      right: 6px;
      top: 10%;
      height: 3px;
      background: #2563eb;
      box-shadow: 0 0 12px #2563eb;
    }

    .copy-action {
      width: 100%;
      padding: 9px;
      border-radius: 12px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 14px;
      background: #2563eb;
      color: #ffffff;
    }

    .copy-action.copied {
      background: #facc15;
      color: #0f172a;
    }

    .kbd-box {
      position: relative;
      display: inline-grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      background: #e2e8f0;
      padding: 7px;
      border-radius: 10px;
      margin-top: 6px;
    }

    .kbd-box span {
      width: 16px;
      height: 10px;
      background: #ffffff;
      border-radius: 3px;
    }

    .kbd-box::after {
      content: "";
      position: absolute;
      left: -6px;
      right: -6px;
      top: 50%;
      height: 3px;
      background: #f59e0b;
      transform: rotate(-14deg);
    }
