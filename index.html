<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Study Hack - Reels Animation (9:16)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Inter:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090d16;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Hind Siliguri', 'Inter', sans-serif;
      overflow: hidden;
    }

    /* 9:16 Reels Viewport Container */
    .reel-wrapper {
      position: relative;
      height: 92vh;
      aspect-ratio: 9 / 16;
      background: #f6f8fc;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65);
    }

    /* Ambient Soft Blobs */
    .blob-blue {
      position: absolute;
      top: -10%;
      left: -15%;
      width: 65%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.16) 0%, transparent 70%);
      pointer-events: none;
    }

    .blob-amber {
      position: absolute;
      bottom: -10%;
      right: -15%;
      width: 65%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.14) 0%, transparent 70%);
      pointer-events: none;
    }

    .scene {
      position: absolute;
      inset: 0;
      padding: 12% 8%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
    }

    .scene.active {
      display: flex;
    }

    .blue { color: #2563eb; }
    .muted { color: #94a3b8; }

    /* Typography scaled for 9:16 Reels */
    .hero-title {
      font-size: clamp(24px, 4.4vh, 44px);
      font-weight: 700;
      color: #0f172a;
      line-height: 1.25;
    }

    .sub-title {
      font-size: clamp(20px, 3.6vh, 36px);
      font-weight: 700;
      color: #0f172a;
      line-height: 1.3;
    }

    .brand-header {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Inter', sans-serif;
      font-size: clamp(16px, 2.6vh, 26px);
      font-weight: 800;
      color: #0f172a;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 14px;
    }

    /* Scene 1: Question -> Note Card */
    .flow-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      width: 86%;
    }

    .doc-card {
      width: 100%;
      background: #ffffff;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 14px 35px rgba(15, 23, 42, 0.08);
      border: 1.5px solid #e2e8f0;
      position: relative;
      text-align: left;
    }

    .skeleton-line {
      height: 10px;
      border-radius: 99px;
      background: #e2e8f0;
      margin-bottom: 10px;
    }

    .scan-ring {
      position: absolute;
      right: 14px;
      bottom: 12px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 3px solid #2563eb;
      background: rgba(37, 99, 235, 0.08);
      animation: pulseRing 1.4s infinite ease-in-out;
    }

    @keyframes pulseRing {
      0%, 100% { transform: scale(0.92); }
      50% { transform: scale(1.06); }
    }

    .note-pill {
      display: inline-block;
      background: #fef3c7;
      color: #92400e;
      font-weight: 700;
      font-size: 14px;
      padding: 3px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    /* Scene 2: Pencil Writing Ends */
    .pencil-badge {
      font-size: 38px;
      margin-bottom: 10px;
      animation: floatPencil 1.2s infinite alternate ease-in-out;
    }

    @keyframes floatPencil {
      from { transform: translateY(0) rotate(-6deg); }
      to { transform: translateY(-8px) rotate(4deg); }
    }

    /* Scene 3: Google Lens Phone */
    .phone-frame {
      width: 74%;
      background: #0f172a;
      border-radius: 34px;
      padding: 12px;
      box-shadow: 0 24px 50px rgba(15, 23, 42, 0.22);
    }

    .phone-screen {
      background: #ffffff;
      border-radius: 24px;
      padding: 18px 14px;
      position: relative;
      overflow: hidden;
    }

    .scan-box {
      border: 2px solid #93c5fd;
      border-radius: 16px;
      padding: 16px 12px;
      position: relative;
      margin-bottom: 16px;
    }

    .scan-line {
      position: absolute;
      left: 8px;
      right: 8px;
      top: 10%;
      height: 3px;
      background: #2563eb;
      box-shadow: 0 0 12px #2563eb;
      transition: top 0.1s linear;
    }

    .lens-btn {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 15px;
      background: #2563eb;
      color: #ffffff;
      transition: all 0.25s ease;
    }

    .lens-btn.copied {
      background: #facc15;
      color: #0f172a;
    }

    .keyboard-strike {
      position: relative;
      display: inline-grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
      background: #e2e8f0;
      padding: 10px;
      border-radius: 12px;
      margin-top: 8px;
    }

    .keyboard-strike span {
      width: 18px;
      height: 12px;
      background: #ffffff;
      border-radius: 3px;
    }

    .keyboard-strike::after {
      content: "";
      position: absolute;
      left: -6px;
      right: -6px;
      top: 50%;
      height: 3px;
      background: #f59e0b;
      transform: rotate(-14deg);
    }

    /* Scene 4: ChatGPT Window */
    .chat-window {
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      padding: 16px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.09);
      border: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 54%;
      justify-content: space-between;
    }

    .bubble-blue {
      align-self: flex-end;
      background: #2563eb;
      color: #fff;
      padding: 10px 14px;
      border-radius: 16px 16px 4px 16px;
      font-size: 14px;
      font-weight: 600;
      text-align: left;
      width: 78%;
    }

    .bubble-user {
      align-self: flex-end;
      background: #f1f5f9;
      color: #0f172a;
      padding: 10px 14px;
      border-radius: 16px 16px 4px 16px;
      font-size: 14px;
      font-weight: 600;
      text-align: left;
      max-width: 85%;
    }

    .chat-input-bar {
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 99px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: #0f172a;
      min-height: 40px;
    }

    .send-circle {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #2563eb;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .timer-pill {
      background: #fef08a;
      color: #854d0e;
      font-weight: 700;
      font-size: 15px;
      padding: 6px 16px;
      border-radius: 99px;
    }

    /* Scene 5: Gamma AI */
    .gamma-box {
      width: 94%;
      background: #ffffff;
      border-radius: 24px;
      padding: 22px 16px;
      box-shadow: 0 18px 45px rgba(15, 23, 42, 0.09);
    }

    .dashed-drop {
      border: 2px dashed #93c5fd;
      background: #eff6ff;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      text-align: left;
    }

    .slides-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .slide-blue {
      background: #2563eb;
      border-radius: 14px;
      padding: 14px;
      height: 110px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .slide-light {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      padding: 14px;
      height: 110px;
    }

    /* Scene 6: Teacher Surprise */
    .teacher-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 20px 50px rgba(37, 99, 235, 0.14);
      position: relative;
      width: 92%;
    }

    .highlight-bar {
      background: linear-gradient(transparent 55%, #fde68a 55%);
      padding: 0 6px;
    }

    /* Scene 7 & 8: Comment & 3 Tools */
    .comment-bar {
      width: 95%;
      background: #ffffff;
      border-radius: 99px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 14px 35px rgba(15, 23, 42, 0.1);
    }

    .tool-cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 92%;
    }

    .tool-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.07);
      text-align: left;
    }

    /* Replay & Progress Bar */
    .progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: rgba(15, 23, 42, 0.1);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #2563eb;
    }

    .controls {
      margin-top: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      color: #cbd5e1;
      font-size: 13px;
    }

    .replay-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="reel-wrapper" id="stage">
    <div class="blob-blue"></div>
    <div class="blob-amber"></div>

    <!-- Scene 1: 0.0s - 2.0s -->
    <section class="scene active" id="scene1">
      <h1 class="hero-title">প্রশ্নের ছবি তুললেই<br>পুরো <span class="blue">নোট রেডি।</span></h1>
      <div class="flow-stack">
        <div class="doc-card">
          <div style="font-weight:700;color:#2563eb;margin-bottom:8px;">? প্রশ্ন</div>
          <div class="skeleton-line" style="width:90%"></div>
          <div class="skeleton-line" style="width:75%"></div>
          <div class="skeleton-line" style="width:82%"></div>
          <div class="scan-ring"></div>
        </div>
        <div style="font-size:26px;color:#2563eb;font-weight:800;">↓</div>
        <div class="doc-card" style="border-color:#bfdbfe;">
          <span class="note-pill">✓ নোট</span>
          <div class="skeleton-line" style="width:88%;background:#cbd5e1;"></div>
          <div class="skeleton-line" style="width:70%;background:#cbd5e1;"></div>
        </div>
      </div>
      <div style="font-size:14px;color:#64748b;font-weight:600;">স্মার্ট স্টাডি হ্যাক</div>
    </section>

    <!-- Scene 2
