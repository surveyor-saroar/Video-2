<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Smart Study Hack - 9:16 Reels Animation</title>
  <script>
    window.__audioCtx = null;
    window.__audioOn = false;
    window.enableSound = function () {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!window.__audioCtx && AC) {
          window.__audioCtx = new AC();
        }
        if (window.__audioCtx && window.__audioCtx.state === "suspended") {
          window.__audioCtx.resume().catch(function () {});
        }
        window.__audioOn = true;
        var bg = document.getElementById("bgMusic");
        if (bg) {
          bg.volume = 0.05;
          if (bg.paused) {
            var p = bg.play();
            if (p && typeof p.catch === "function") p.catch(function () {});
          }
        }
      } catch (e) {}
    };
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-family: "Hind Siliguri", "Nirmala UI", Arial, sans-serif;
      background-color: #eef3fb;
      background-image:
        radial-gradient(circle at 18% 20%, rgba(37, 99, 235, 0.22), transparent 52%),
        radial-gradient(circle at 82% 78%, rgba(245, 158, 11, 0.22), transparent 54%),
        linear-gradient(160deg, rgba(219, 234, 254, 0.55) 0%, rgba(248, 250, 252, 0.85) 50%, rgba(254, 243, 199, 0.45) 100%);
    }

    #reelCanvas {
      position: relative; z-index: 1;
      width: 405px; height: 720px; flex-shrink: 0;
      background: transparent; overflow: hidden; cursor: pointer;
      transform-origin: center center;
    }

    .scene {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      padding: 24px 24px 185px; gap: 9px;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; z-index: 2;
      transform-origin: center center;
    }
    .scene.active { display: flex; }

    #sc5 { justify-content: center; padding-top: 24px; padding-bottom: 185px; gap: 10px; }
    #sc7 { justify-content: center; padding-top: 24px; padding-bottom: 185px; gap: 14px; }

    .blue { color: #2563eb; }
    .muted { color: #94a3b8; }

    .header-row { display: inline-flex; align-items: center; justify-content: center; gap: 11px; }
    .svg-badge {
      width: 44px; height: 44px; border-radius: 13px;
      background: #eff6ff; border: 1.5px solid #bfdbfe; color: #2563eb;
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.12);
    }
    .svg-badge.amber {
      background: #fef9c3; border-color: #fde047; color: #b45309;
      box-shadow: 0 6px 16px rgba(245, 158, 11, 0.16);
    }
    .svg-badge svg { width: 24px; height: 24px; display: block; }

    .h1-main { font-size: 28px; font-weight: 700; color: #0f172a; line-height: 1.24; text-align: left; }
    .h2-sub { font-size: 22px; font-weight: 700; color: #0f172a; line-height: 1.26; text-align: left; }

    .brand-pill { display: inline-flex; align-items: center; gap: 9px; font-size: 20px; font-weight: 800; color: #0f172a; }
    .brand-logo {
      width: 28px; height: 28px; border-radius: 8px; background: #2563eb; color: #ffffff;
      display: flex; align-items: center; justify-content: center; font-size: 14px;
    }

    #sc5 .brand-pill { font-size: 23px; gap: 9px; }
    #sc5 .brand-logo { width: 32px; height: 32px; border-radius: 9px; font-size: 16px; }

    .cards-flow { display: flex; flex-direction: column; align-items: center; gap: 9px; width: 90%; margin: 4px 0; }
    .white-card {
      width: 100%; background: #ffffff; border-radius: 18px; padding: 13px 15px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.07); border: 1.5px solid #e2e8f0;
      position: relative; text-align: left;
    }

    @keyframes trimRightAnim {
      0% { transform: scaleX(1) translateX(0); opacity: 1; }
      55% { transform: scaleX(0.35) translateX(22px); opacity: 0.65; }
      100% { transform: scaleX(1) translateX(0); opacity: 1; }
    }

    .skel {
      height: 9px; border-radius: 99px; background: #e2e8f0; margin-bottom: 7px;
      transform-origin: right center;
    }
    .scene.active .skel:not(.sc3-line) {
      animation: trimRightAnim 0.85s ease-in-out infinite both;
    }
    .scene.active .skel:not(.sc3-line):nth-of-type(2) { animation-delay: 0.1s; }
    .scene.active .skel:not(.sc3-line):nth-of-type(3) { animation-delay: 0.2s; }
    .scene.active .skel:not(.sc3-line):nth-of-type(4) { animation-delay: 0.3s; }

    .sc3-line { transform-origin: right center; }
    .scene.active #sc3 .sc3-line {
      animation: trimRightAnim 0.8s ease-in-out infinite both;
    }
    .scene.active #sc3 .sc3-line:nth-of-type(2) { animation-delay: 0.08s; }
    .scene.active #sc3 .sc3-line:nth-of-type(3) { animation-delay: 0.16s; }
    .scene.active #sc3 .sc3-line:nth-of-type(4) { animation-delay: 0.24s; }
    .scene.active #sc3 .sc3-line:nth-of-type(5) { animation-delay: 0.32s; }

    .ring-pulse {
      position: absolute; right: 10px; bottom: 6px; width: 88px; height: 88px;
      border-radius: 50%; border: 5px solid #2563eb; background: rgba(37, 99, 235, 0.08);
    }
    .yellow-tag {
      display: inline-block; background: #fef3c7; color: #92400e;
      font-weight: 700; font-size: 12px; padding: 2px 10px; border-radius: 8px; margin-bottom: 6px;
    }
    #sc5 .yellow-tag { font-size: 13px; padding: 2px 10px; }
    .pencil-anim { font-size: 46px; margin-bottom: 10px; }

    .phone-body {
      width: 70%; background: #0f172a; border-radius: 28px; padding: 9px;
      box-shadow: 0 22px 45px rgba(15, 23, 42, 0.2); margin: 2px 0;
    }
    .phone-display { background: #ffffff; border-radius: 20px; padding: 11px; position: relative; overflow: hidden; }
    .scan-box { border: 2px solid #93c5fd; border-radius: 14px; padding: 10px; position: relative; margin-bottom: 9px; }
    .laser-line {
      position: absolute; left: 6px; right: 6px; top: 10%; height: 3px;
      background: #2563eb; box-shadow: 0 0 12px #2563eb;
    }
    .copy-action { width: 100%; padding: 8px; border-radius: 12px; font-weight: 700; font-size: 14px; background: #2563eb; color: #ffffff; transition: background 0.1s ease, color 0.1s ease; }
    .copy-action.copied { background: #facc15; color: #0f172a; }

    .kbd-box {
      position: relative; display: inline-grid; grid-template-columns: repeat(5, 1fr);
      gap: 5px; background: #e2e8f0; padding: 7px; border-radius: 10px; margin-top: 5px;
    }
    .kbd-box span { width: 16px; height: 10px; background: #ffffff; border-radius: 3px; }
    .kbd-box::after {
      content: ""; position: absolute; left: -6px; right: -6px; top: 50%; height: 3px;
      background: #f59e0b; transform: rotate(-14deg);
    }

    .chat-box {
      width: 100%; background: #ffffff; border-radius: 22px; padding: 12px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08); border: 1px solid #e2e8f0;
      display: flex; flex-direction: column; gap: 8px; height: 270px; justify-content: space-between; margin: 2px 0;
    }
    .bubble-pasted {
      align-self: flex-end; background: #2563eb; color: #ffffff;
      padding: 8px 12px; border-radius: 14px 14px 4px 14px; font-size: 13px; font-weight: 600; text-align: left; width: 78%;
    }
    .bubble-prompt {
      align-self: flex-end; background: #eff6ff; border: 1px solid #bfdbfe; color: #0f172a;
      padding: 8px 12px; border-radius: 14px 14px 4px 14px; font-size: 13px; font-weight: 600; text-align: left; max-width: 88%;
    }
    .input-bar {
      background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 99px;
      padding: 6px 11px; display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: #0f172a; min-height: 36px;
    }
    .send-icon {
      width: 24px; height: 24px; border-radius: 50%; background: #2563eb; color: #ffffff;
      display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0;
    }
    .time-chip { background: #fef08a; color: #854d0e; font-weight: 700; font-size: 14px; padding: 5px 15px; border-radius: 99px; }

    .gamma-box {
      position: relative;
      width: 94%; background: #ffffff; border-radius: 22px; padding: 14px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08); border: 1px solid #e2e8f0; margin: 0 auto;
    }
    .dashed-area { border: 2px dashed #93c5fd; background: #eff6ff; border-radius: 14px; padding: 11px; margin-bottom: 10px; text-align: left; }
    .slides-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
    .card-blue { background: #2563eb; border-radius: 12px; padding: 10px; height: 88px; display: flex; flex-direction: column; justify-content: space-between; }
    .card-light { background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 10px; height: 88px; }
    #sc5GenBtn { font-size: 16px; padding: 9px 24px; border-radius: 12px; }
    #sc5After .slide-label { font-size: 15px; font-weight: 800; }
    .gamma-pdf-corner {
      position: absolute; top: -13px; right: -11px;
      background: #facc15; color: #0f172a; font-weight: 900; font-size: 22px;
      line-height: 1.05; padding: 7px 14px; border-radius: 13px;
      border: 2.5px solid #eab308; box-shadow: 0 10px 24px rgba(234, 179, 8, 0.35); z-index: 4;
    }
    #sc5Caption .h2-sub { font-size: 23px; font-weight: 800; line-height: 1.24; }
    #sc5Caption .svg-badge { width: 44px; height: 44px; }

    .teacher-box {
      background: #ffffff; border-radius: 22px; padding: 24px 20px;
      box-shadow: 0 18px 45px rgba(37, 99, 235, 0.12); border: 1px solid #e2e8f0; width: 94%;
    }
    .shock-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .shock-sign {
      width: 54px; height: 54px; border-radius: 16px;
      background: #fef08a; border: 2px solid #f59e0b; color: #b45309;
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
      box-shadow: 0 8px 20px rgba(245, 158, 11, 0.25);
    }
    .shock-sign svg { width: 30px; height: 30px; display: block; }
    .hl-yellow { background: linear-gradient(transparent 55%, #fde68a 55%); padding: 0 5px; }

    .outro-header {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      width: 100%; background: transparent; border: none; box-shadow: none; padding: 2px 0;
    }
    .outro-top-pill {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      background: #ffffff; color: #b45309; border: 1.5px solid #fde047; border-radius: 999px;
      padding: 5px 14px; font-size: 14px; font-weight: 800; line-height: 1.2;
      box-shadow: 0 6px 16px rgba(15, 23, 42, 0.06);
    }
    .outro-top-pill svg { width: 15px; height: 15px; display: block; flex-shrink: 0; }
    .outro-single-line {
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800; line-height: 1.3; color: #0f172a; white-space: nowrap;
    }
    .outro-yellow-half {
      display: inline-block; background: #facc15; color: #0f172a;
      padding: 1px 7px; border-radius: 7px; margin-right: 4px;
    }

    .outro-showcase {
      width: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 10px; padding: 4px 0;
    }
    .video-motion-row {
      display: inline-flex; align-items: center; justify-content: center; gap: 18px; min-height: 106px;
    }

    .tap-network-wrap {
      position: relative; width: 96px; height: 104px;
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .underhand-wave-circle {
      position: absolute; top: 26px; left: 50%; width: 34px; height: 34px;
      margin-left: -17px; margin-top: -17px; border-radius: 50%;
      border: 2.5px solid #2563eb; background: rgba(37, 99, 235, 0.08);
      pointer-events: none; z-index: 1; transform-origin: center center;
    }
    .underhand-wave-circle.mid { border-color: #0ea5e9; background: rgba(14, 165, 233, 0.06); }
    .underhand-wave-circle.outer { border-color: #f59e0b; background: rgba(245, 158, 11, 0.06); }
    .tap-network-icon {
      position: relative; z-index: 4; width: 78px; height: 78px; margin-bottom: 12px;
      display: inline-flex; align-items: center; justify-content: center;
      transform-origin: center center; filter: drop-shadow(0 8px 16px rgba(15, 23, 42, 0.24));
    }
    .tap-network-icon img { width: 100%; height: 100%; object-fit: contain; display: block; }

    .outro-avatar-circle {
      width: 84px; height: 84px; border-radius: 50%; border: 3px solid #2563eb;
      background: #e2e8f0; color: #0f172a; font-weight: 800; font-size: 22px;
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
      overflow: hidden; position: relative; box-shadow: 0 8px 20px rgba(15, 23, 42, 0.18);
    }
    .outro-avatar-circle img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
    .outro-avatar-circle .avatar-fallback { display: none; }
