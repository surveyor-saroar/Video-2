<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Study Hack - Reels Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Inter:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Full Screen Background */
    body {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Hind Siliguri', 'Inter', sans-serif;
      background:
        radial-gradient(circle at 18% 22%, rgba(37, 99, 235, 0.22), transparent 42%),
        radial-gradient(circle at 82% 78%, rgba(245, 158, 11, 0.16), transparent 45%),
        #090d16;
    }

    /* Subtle Full-Screen Grid Texture */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* 9:16 Reels Animation Frame Only */
    .reel-frame {
      position: relative;
      z-index: 1;
      height: 94vh;
      max-height: 960px;
      aspect-ratio: 9 / 16;
      background: #f6f8fc;
      border-radius: 32px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 30px 90px rgba(0, 0, 0, 0.75);
      cursor: pointer;
    }

    .blob-blue {
      position: absolute;
      top: -10%;
      left: -15%;
      width: 65%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.18) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .blob-amber {
      position: absolute;
      bottom: -10%;
      right: -15%;
      width: 65%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.16) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .scene {
      position: absolute;
      inset: 0;
      padding: 11% 7%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      text-align: center;
      z-index: 1;
      animation: fadeScene 0.35s ease;
    }

    .scene.active {
      display: flex;
    }

    @keyframes fadeScene {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .blue { color: #2563eb; }
    .muted { color: #94a3b8; }

    .hero-title {
      font-size: clamp(26px, 4.5vh, 46px);
      font-weight: 700;
      color: #0f172a;
      line-height: 1.25;
    }

    .sub-title {
      font-size: clamp(21px, 3.7vh, 38px);
      font-weight: 700;
      color: #0f172a;
      line-height: 1.3;
    }

    .brand-header {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: 'Inter', sans-serif;
      font-size: clamp(17px, 2.7vh, 28px);
      font-weight: 800;
      color: #0f172a;
    }

    .brand-icon {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: #2563eb;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 14px;
    }

    .flow-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 88%;
    }

    .doc-card {
      width: 100%;
      background: #ffffff;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 14px 35px rgba(15, 23, 42, 0.08);
      border: 1.5px solid #e2e8f0;
      position: relative;
      text-align: left;
    }

    .skeleton-line {
      height: 10px;
      border-radius: 99px;
      background: #e2e8f0;
      margin-bottom: 9px;
      transition: background 0.2s ease;
    }

      right: 14px;
      bottom: 12px;
      width: 54px;

      border-radius: 50%;
