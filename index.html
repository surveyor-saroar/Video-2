<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animation with Low Background Audio</title>
  <style>
    body {
      margin: 0;
      background: #090d16;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .stage {
      width: 320px;
      height: 320px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .box {
      width: 80px;
      height: 80px;
      border-radius: 14px;
      background: #ffd400;
      transition: transform 0.6s ease;
    }

    .box.animate {
      transform: translateX(70px) rotate(45deg);
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #ffd400;
      color: #090d16;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div id="animBox" class="box"></div>
  </div>

  <button id="playBtn">অ্যানিমেশন চালু করুন</button>

  <!-- অডিও ক্লিপের ফাইলের নাম এখানে দিন -->
  <audio id="bgMusic" src="Let Me Go — Alan Walker Style Emotional EDM & Heartbreak Vibes.mp3" preload="auto"></audio>

  <script>
    const bgMusic = document.getElementById("bgMusic");
    const animBox = document.getElementById("animBox");
    const playBtn = document.getElementById("playBtn");

    // অ্যানিমেশনের যতটুকু সময় দরকার (মিলিসেকেন্ডে), যেমন ১০ সেকেন্ড = 10000
    const animationDurationMs = 10000;

    function playAnimationAndBgAudio() {
      // ক্লিপের ছোট সাউন্ড বা ভয়েস স্পষ্ট রাখার জন্য ব্যাকগ্রাউন্ড অডিওর ভলিউম কম রাখা হয়েছে
      bgMusic.volume = 0.15;
      bgMusic.currentTime = 0; // অডিও ক্লিপের প্রথম অংশ থেকে শুরু
      bgMusic.play().catch(() => {});

      // অ্যানিমেশন শুরু
      animBox.classList.remove("animate");
      void animBox.offsetWidth;
      animBox.classList.add("animate");

      // নির্ধারিত সময় পর অডিও বন্ধ (যতটুকু অংশ লাগে ততটুকুই ব্যবহার হবে)
      clearTimeout(window.bgAudioStopTimer);
      window.bgAudioStopTimer = setTimeout(() => {
        bgMusic.pause();
        bgMusic.currentTime = 0;
      }, animationDurationMs);
    }

    playBtn.addEventListener("click", playAnimationAndBgAudio);
  </script>
</body>
</html>
